# @package interpreter
defaults:
  - jupyter

# Binds are set in dojo.utils.binds (agentssl_run.py).
read_only_binds: {}
read_write_binds: {}

# Defaults; configure_agentssl_binds() merges these with container paths.
env:
  DATA_DIR: /data # Where the data is stored
  TASK_DIR: /task # Where the task information is stored (e.g. task.yaml, task_description.md, annotations)
  PROGRAM_PATH: /program.py # Where the agent solution will be written to
  WORKSPACE: /workspace # Where agent can read and write to
  PYTHONPATH: /eval # Where the evaluation code is stored
  HF_HUB_OFFLINE: "0" # Whether to offline mode for HF Hub (default is online)
  TRANSFORMERS_OFFLINE: "0" # Whether to offline mode for Transformers (default is online)
